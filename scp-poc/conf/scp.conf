# nginx-scp demo configuration
#
# A minimal 5G SCP: consumers send SBI requests to the SCP over HTTP/2 (h2c)
# with a 3gpp-Sbi-Target-apiRoot header. The ngx_http_scp_module validates the
# request, exposes $scp_backend, and the request is proxied over HTTP/2 (h2c)
# to the matching NF-set upstream{} block, which load-balances across instances.
#
# Run (from repo root, after building with --add-module=scp-poc/module):
#   /tmp/scp_objs/nginx -p "$PWD/scp-poc" -c conf/scp.conf

worker_processes  1;
daemon            off;
error_log         logs/scp-error.log info;
pid               logs/scp.pid;

events {
    worker_connections  1024;
}

http {
    access_log  logs/scp-access.log;

    # --- NF-set upstreams -------------------------------------------------
    # The upstream name must equal the host in 3gpp-Sbi-Target-apiRoot so the
    # variabilised proxy_pass below routes to it (and load-balances).

    upstream udm-set {
        zone udm_set 64k;
        server 127.0.0.1:9101 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:9102 max_fails=1 fail_timeout=5s;
        keepalive 32;   # reuse HTTP/2 connections to the NFs
    }

    upstream amf-set {
        zone amf_set 64k;
        server 127.0.0.1:9201 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    # --- The SCP ----------------------------------------------------------

    server {
        listen       8080;         # h2c (cleartext HTTP/2) from consumers
        http2        on;
        server_name  scp;

        location / {
            scp                 on;    # enable SBI processing
            scp_require_target  on;    # 3gpp-Sbi-Target-apiRoot mandatory
            scp_require_oauth   on;    # require an OAuth2 bearer token

            # Route (Model D) to the NF set named by the target apiRoot host,
            # forwarding over HTTP/2 end-to-end.
            proxy_http_version  2;
            proxy_pass          http://$scp_backend;

            # Preserve / surface SBI context + reselect on failure.
            proxy_set_header    Host $scp_target_authority;
            proxy_next_upstream error timeout http_502 http_503 http_504;

            # Observability: expose routing decision in the access log.
            add_header          X-Scp-Backend   $scp_backend  always;
            add_header          X-Scp-Has-Token $scp_has_token always;
        }
    }
}
